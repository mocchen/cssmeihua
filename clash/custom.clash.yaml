port: 7890
socks-port: 7891
allow-lan: true
ipv6: true
bind-address: "*"
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true #【Meta专属】使用geoip.dat数据库(默认：false使用mmdb数据库)
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
