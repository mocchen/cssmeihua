tun:
  enable: false
  stack: system
  device: mochen
  auto-route: true
  auto-detect-interface: true
  endpoint-independent-nat: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  mtu: 1380
  udp-timeout: 180
proxies: []

proxy-groups:
  - name: 🚀 默认代理
    type: select
    proxies:
