    - https://dns.alidns.com/dns-query
    - 119.29.29.2
    - tls://dot.pub
    - 114.114.114.114
  nameserver-policy:
    "+.cloudapp.azure.com": [1.1.1.1]
    "+.monsterhunter.com": [1.1.1.1]
    "+.capcom.com": [1.1.1.1]
  fallback:
    - tls://dns.rubyfish.cn:853
    - https://dns.google/dns-query
    - tls://1.0.0.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
