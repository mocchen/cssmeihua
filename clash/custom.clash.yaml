port: 7890
socks-port: 7891
allow-lan: true
ipv6: true
bind-address: "*"
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
tcp-concurrent: true
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 60
disable-keep-alive: false
geodata-mode: true 
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
experimental:
  ignore-resolve-fail: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query  
    - https://dns.google/dns-query                
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - 223.5.5.5
  nameserver-policy:
    geosite:private:
      - dhcp://system
    DOMAIN-SUFFIX,wifi.cmcc: 
      - dhcp://system
    DOMAIN-SUFFIX,p.to: 
      - dhcp://system
    geosite:cn: 
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query  
      - 223.5.5.5                  
      - 119.29.29.29              
    geosite:gfw:
      - 'https://dns.google/dns-query'
      - 'https://cloudflare-dns.com/dns-query'
    geosite:geolocation-!cn:
      - 'https://dns.google/dns-query'
      - 'https://cloudflare-dns.com/dns-query'
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - 223.5.5.5                  
    - 119.29.29.29  
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - 'RULE-SET,fake-ip-filter,real-ip'
    - 'GEOSITE,private,real-ip'
    - 'GEOSITE,connectivity-check,real-ip'
    - 'MATCH,fake-ip'

rule-providers:
  fake-ip-filter:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/mocchen/cssmeihua/refs/heads/mochen/clash/rules/fake-ip-filter.yaml"
    interval: 86400
    path: ./rules/fake-ip-filter.yaml
    proxy: 默认代理
    size-limit: 0

tun:
  enable: true
  stack: mips
  device: mochen
  auto-route: true
  endpoint-independent-nat: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  mtu: 1500
  udp-timeout: 120
  congestion-controller: "bbr"
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443]
    HTTP:
      ports: [80, 8080-8880]
    QUIC:
      ports: [443]
ntp:
  enable: true
  server: time.apple.com
  port: 123
  interval: 30
  write-to-system: false

proxies: []

proxy-groups:
  - name: 默认代理
    type: select
    icon: https://raw.githubusercontent.com/Hawaiine/Oasisic-Icons/main/icons/System/Proxy/Proxy.png
