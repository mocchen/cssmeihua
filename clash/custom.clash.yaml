port: 7890
socks-port: 7891
allow-lan: true
ipv6: true
bind-address: "*"
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
tcp-concurrent: true
find-process-mode: strict
geodata-mode: true #【Meta专属】使用geoip.dat数据库(默认：false使用mmdb数据库)
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"
experimental:
  ignore-resolve-fail: true
dns:
  enable: true
  listen: 1053
  ipv6: false
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query    # Cloudflare（支持 H3）
    - https://dns.google/dns-query # Google（支持 H3）
    - 1.1.1.1                      # Cloudflare Public DNS (UDP)
    - 8.8.8.8                      # Google Public DNS (UDP)
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - 223.5.5.5
  nameserver-policy:
    "geosite:cn,private": # 国内域名和私有域名强制走国内 DNS
      - https://223.5.5.5/dns-query # 阿里
      - https://doh.pub/dns-query   # 腾讯
      - 223.5.5.5                   # 阿里 UDP
      - 119.29.29.29                # 腾讯 UDP
    "geo:cn":                       # 也可以用 geo:cn 匹配 IP
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
      - 223.5.5.5                   # 阿里 UDP
      - 119.29.29.29                # 腾讯 UDP
    "geosite:gfw":                  # 新增：GFW 列表域名强制走国外 DNS
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
      - 1.1.1.1
      - 8.8.8.8
    "geosite:geolocation-!cn":      # 新增：非中国大陆域名强制走国外 DNS
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
      - 1.1.1.1
      - 8.8.8.8
    "full-nameserver":              # 新增：最终兜底，所有未匹配的域名查询强制走国外 DNS
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
      - 1.1.1.1
      - 8.8.8.8
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
      - +.githubusercontent.com
      - +.googlevideo.com
      - +.msftconnecttest.com
      - +.msftncsi.com
      - msftconnecttest.com
      - msftncsi.com
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:fakeip-filter"
tun:
  enable: false
  stack: system
  device: mochen
  auto-route: true
  auto-detect-interface: true
  endpoint-independent-nat: true
  gso: true
  gso-max-size: 65536
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: false
  mtu: 1500
  udp-timeout: 120
proxies: []

proxy-groups:
  - name: 🚀 默认代理
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡

  - name: 🎮 游戏
    type: select
    proxies: []

  - name: 🎮 steam
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - DIRECT

  - name: 📹 YouTube
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🍀 Google
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 📺 Bilibili
    type: select
    proxies:
      - DIRECT
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🤖 ChatGPT
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 👨🏿‍💻 GitHub
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🐬 OneDrive
    type: select
    proxies:
      - DIRECT
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🪟 Microsoft
    type: select
    proxies:
      - DIRECT
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🎵 TikTok
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 📲 Telegram
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🎥 NETFLIX
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: ✈️ Speedtest
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - DIRECT

  - name: 💶 PayPal
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🍎 Apple
    type: select
    proxies:
      - DIRECT
      - 🚀 默认代理
      - ♻️ 自动选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 默认代理
      - ♻️ 自动选择
      - DIRECT

  - name: 🎯 直连
    type: select
    proxies:
      - DIRECT
      - 🚀 默认代理

  - name: ♻️ 自动选择
    type: url-test
    url: http://cp.cloudflare.com/
    interval: 300
    tolerance: 50
    timeout: 300
    max-failed-times: 3
    proxies: []

  - name: 🔯 故障转移
    type: fallback
    url: http://cp.cloudflare.com/
    interval: 300
    tolerance: 50
    timeout: 300
    max-failed-times: 3
    proxies: []

  - name: 🔮 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://cp.cloudflare.com/
    interval: 300
    tolerance: 50
    timeout: 300
    max-failed-times: 3
    proxies: []
     
